<script>
window.rqfRun=async()=>{const fields=__RQF_V2_PARTS.discover(), resolved=__RQF_V2_PARTS.resolveAll(fields);const keys=resolved.map(x=>x&&x.spec.key);const checks={
  '重复区块自动编号':keys.includes('education.0.school')&&keys.includes('education.0.major')&&keys.includes('education.1.school')&&keys.includes('education.1.major'),
  '下划线路径解析':keys.includes('projects.0.role')&&keys.filter(x=>x==='education.1.school').length>=2,
  '组合框宿主去重':fields.filter(x=>x.text.includes('期望城市')).length===1,
  '标准无障碍标签':keys[7]==='basic.email',
  '包裹标签不依赖字段id':keys[8]==='basic.phone',
  '英文词边界避免误识别':keys[9]===null,
};const fails=Object.keys(checks).filter(k=>!checks[k]);return {page:'generic-rules-v2.html',version:__RQF_V2.version,pass:!fails.length,total:Object.keys(checks).length,fails,keys}};
if(location.search.includes('run=1'))rqfRun().then(r=>parent.postMessage({__rqf:true,...r},'*'));
</script>
