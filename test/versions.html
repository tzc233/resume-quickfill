<!doctype html><meta charset="utf-8"><title>多份简历:各自独立维护</title>
<!-- 用户要的是「央国企一份、私企一份」,各自独立维护:事实、经历的增删都可以不同,
     附件 PDF 也各是各的。2.22.0 的「事实共享、只覆盖措辞」把事实锁成只读,不合用。
     现在每份简历是一整份档案;为防两份写出矛盾的事实,只在体检里提醒,不锁。 -->
<script src="../versions.js"></script>
<script>
const st = {
  profile: { _name: '私企', basic: { fullName: '示例姓名', phone: '13000000000' }, intro: '私企介绍',
    competitions: [{ name: '示例竞赛', type: '省级', result: '二等奖' }],
    awards: [{ name: '示例奖学金', type: '校级' }] },
  altProfiles: { soe: { name: '央国企', profile: { basic: { fullName: '示例姓名', phone: '' }, intro: '国企介绍',
    competitions: [{ name: '示例竞赛', type: '国家级', result: '二等奖' }],
    projects: [{ name: '只在国企版的项目' }] } } },
  resumeFile: { name: '私企.pdf' }, resumeFiles: {},
};
const V = window.rqfVersions;
const soe = V.pick(st, 'soe'), pri = V.pick(st, 'default'), ghost = V.pick(st, 'gone');
soe.profile.intro = '改了副本';
const diffs = V.factDiffs(st.profile, st.altProfiles.soe.profile);
const old = V.migrate({ profile: { intro: '默认介绍', skills: '默认技能', defaultVersionName: '互联网',
  versions: [{ id: 'v1', name: '央国企' }], _v: { v1: { intro: '国企介绍' } },
  work: [{ company: '示例科技', desc: '默认描述', _v: { v1: { desc: '国企描述' } } }] } });
const checks = {
  列出全部简历: V.list(st).map((x) => x.name).join('/') === '私企/央国企',
  选央国企拿到它的全部内容: V.pick(st, 'soe').profile.intro === '国企介绍' && soe.profile.projects.length === 1,
  选私企拿到私企的内容: pri.profile.intro === '私企介绍' && !pri.profile.projects,
  拿到的是副本互不影响: st.altProfiles.soe.profile.intro === '国企介绍',
  私企带自己的附件: pri.resumeFile && pri.resumeFile.name === '私企.pdf',
  // 宁可不传,也不拿私企版的 PDF 去投央国企
  央国企没传附件就不带附件: soe.resumeFile === null,
  不存在的简历按默认: ghost.profile.intro === '私企介绍',
  引擎看不到名字等元数据: !('_name' in pri.profile),
  事实矛盾能查出: diffs.some((d) => d.list === 'competitions' && d.name === '示例竞赛' && d.field === 'type'
    && d.a === '省级' && d.b === '国家级'),
  一边空着不算矛盾: !diffs.some((d) => d.field === 'basic.phone'),
  只在一边有的经历不算矛盾: !diffs.some((d) => d.list === 'projects' || d.list === 'awards'),
  措辞不同不算矛盾: !diffs.some((d) => d.field === 'intro'),
  '2.22 的版本结构自动转成独立简历': old.changed && old.altProfiles.v1.name === '央国企'
    && old.altProfiles.v1.profile.intro === '国企介绍' && old.altProfiles.v1.profile.work[0].desc === '国企描述'
    && old.altProfiles.v1.profile.skills === '默认技能'
    && old.profile.intro === '默认介绍' && old.profile._name === '互联网'
    && !JSON.stringify(old).includes('"_v"') && !('versions' in old.profile),
  没有旧结构就不转换: !V.migrate(st).changed,
};
const fails = Object.keys(checks).filter((k) => !checks[k]);
const r = { page: 'versions.html', pass: !fails.length, total: Object.keys(checks).length, fails };
if (location.search.includes('run=1')) parent.postMessage({ __rqf: true, ...r }, '*');
</script>
