<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>测试沙盒 · 京东空表单(每个区块只有「+ 添加」)</title>
<style>
 body{font:14px/1.6 -apple-system,"PingFang SC",sans-serif;color:#1f2937;margin:16px;padding-left:170px}
 .ant-anchor-wrapper{position:fixed;left:8px;top:16px;width:150px;font-size:12.5px;
   border:1px dashed #d1d5db;border-radius:8px;padding:6px}
 .ant-anchor-link{padding:2px 0}
 .titleContainer___2E0OM{font-size:15px;font-weight:600;margin:16px 0 6px;
   border-left:3px solid #4f46e5;padding-left:8px}
 .titledesc___2Ke5H{font-size:12px;font-weight:400;color:#9ca3af}
 .fieldItem___1hMDk{display:flex;gap:10px;margin:6px 0;align-items:flex-start}
 .filedName___2rXII{width:180px;flex-shrink:0;font-size:13px;padding-top:5px}
 .filedValue___orYso{width:520px;flex-shrink:0}
 .ant-input{width:100%;padding:5px 9px;border:1px solid #d1d5db;border-radius:4px;font:inherit}
 .addBtn___3r3aQ{display:inline-block;padding:4px 14px;border:1px dashed #4f46e5;
   border-radius:4px;color:#4f46e5;cursor:pointer;font-size:13px}
 .gridContainer___1K4Rp{border:1px solid #f1f5f9;border-radius:8px;padding:6px 12px;margin-bottom:8px}
 .ant-cascader-picker{display:inline-flex;align-items:center;width:260px;border:1px solid #d1d5db;
   border-radius:4px;padding:3px 8px;background:#fff;cursor:pointer}
 .ant-cascader-picker input{border:none;outline:none;width:100%;background:transparent}
 .ant-calendar-picker{display:inline-block;width:150px}
 .ant-calendar-picker input{width:100%;padding:4px 8px;border:1px solid #d1d5db;border-radius:4px;font:inherit}
 .ant-calendar,.ant-cascader-menus{position:absolute;z-index:80;background:#fff;border:1px solid #e5e7eb;
   border-radius:6px;box-shadow:0 6px 20px rgba(0,0,0,.14);padding:6px}
 .ant-calendar[hidden],.ant-cascader-menus[hidden]{display:none}
 .ant-calendar-header{display:flex;justify-content:space-between;font-size:12px;padding:2px 4px 6px}
 .ant-calendar-header a{cursor:pointer;color:#4f46e5}
 .ant-calendar table{border-collapse:collapse}
 .ant-calendar-cell{width:30px;height:24px;text-align:center;font-size:12px;cursor:pointer}
 .ant-calendar-cell:hover{background:#eef2ff}
 .ant-cascader-menu{display:inline-block;vertical-align:top;min-width:110px;max-height:180px;overflow:auto;
   border-right:1px solid #f1f5f9;padding:2px}
 .ant-cascader-menu-item{padding:4px 9px;border-radius:4px;cursor:pointer;font-size:13px}
 .ant-cascader-menu-item:hover{background:#eef2ff}
</style>
</head>
<body>

<!-- 真实的锚点导航:12 条链接,class 里带 title,位于表单之前 -->
<div class="ant-anchor-wrapper"><div class="ant-anchor fixed">
 <div class="ant-anchor-link"><a class="ant-anchor-link-title" title="招聘信息来源">招聘信息来源</a></div>
 <div class="ant-anchor-link"><a class="ant-anchor-link-title" title="基本信息">基本信息</a></div>
 <div class="ant-anchor-link"><a class="ant-anchor-link-title" title="教育经历">教育经历</a></div>
 <div class="ant-anchor-link"><a class="ant-anchor-link-title" title="实习经历">实习经历</a></div>
 <div class="ant-anchor-link"><a class="ant-anchor-link-title" title="项目经历">项目经历</a></div>
 <div class="ant-anchor-link"><a class="ant-anchor-link-title" title="荣誉奖励">荣誉奖励</a></div>
 <div class="ant-anchor-link"><a class="ant-anchor-link-title" title="论文/期刊">论文/期刊</a></div>
</div></div>

<div class="gridContainer___1K4Rp">
 <div class="titleContainer___2E0OM"><span>基本信息<span class="redTitle___2-QVW">*</span></span></div>
 <div class="fieldItem___1hMDk"><div class="filedName___2rXII"><span class="requiredStar___28AbY">*</span>姓名:</div>
  <div class="filedValue___orYso"><input class="ant-input" id="e-name" placeholder="请输入"></div></div>
 <div class="fieldItem___1hMDk"><div class="filedName___2rXII"><span class="requiredStar___28AbY">*</span>手机号码:</div>
  <div class="filedValue___orYso"><input class="ant-input" id="e-phone" placeholder="请输入"></div></div>
 <div class="fieldItem___1hMDk"><div class="filedName___2rXII"><span class="requiredStar___28AbY">*</span>籍贯:</div>
  <div class="filedValue___orYso"><span class="ant-cascader-picker" id="e-home"><span class="ant-cascader-picker-label"></span><input class="ant-input ant-cascader-input" placeholder="请选择" readonly></span></div></div>
</div>

<!-- 关键:标题容器里挂着一段说明文字。整段算进去就超长度上限,
     整个区块标题会被丢掉 —— 京东的教育/实习正是这样漏掉的。 -->
<div class="gridContainer___1K4Rp" data-blk="edu">
 <div class="titleContainer___2E0OM"><span>教育经历<span class="redTitle___2-QVW">*</span></span>
  <div class="titledesc___2Ke5H">从最高学历开始填写，包括第一学历到最高学历的全部信息，填写后请仔细检查学历信息是否正确。</div></div>
 <div class="contentItem___3Qrnc"><a role="button" class="am-button addBtn___3r3aQ"><span>+ 添加</span></a></div>
</div>

<div class="gridContainer___1K4Rp" data-blk="intern">
 <div class="titleContainer___2E0OM"><span>实习经历</span>
  <div class="titledesc___2Ke5H">据说这部分信息超级重要，是面试官的重要参考信息呢！</div></div>
 <div class="contentItem___3Qrnc"><a role="button" class="am-button addBtn___3r3aQ"><span>+ 添加</span></a></div>
</div>

<div class="gridContainer___1K4Rp" data-blk="proj">
 <div class="titleContainer___2E0OM"><span>项目经历</span></div>
 <div class="contentItem___3Qrnc"><a role="button" class="am-button addBtn___3r3aQ"><span>+ 添加</span></a></div>
</div>

<div class="gridContainer___1K4Rp" data-blk="award">
 <div class="titleContainer___2E0OM"><span>荣誉奖励</span></div>
 <div class="contentItem___3Qrnc"><a role="button" class="am-button addBtn___3r3aQ"><span>+ 添加</span></a></div>
</div>

<script>
/* 点「+ 添加」在本区块里追加一组字段,与京东行为一致 */
/* 按京东的真实字段构成。注意 award 块【没有「奖项名称」】——
   一个能当锚点的字段都没有,这正是荣誉只展开一段的成因。 */
const TPL = {
  edu: [['range','_'],['学校名称','school'],['学院名称','college'],['专业名称','major']],
  intern: [['range','_'],['公司名称','co'],['职位名称','title'],['工作描述','desc']],
  proj: [['range','_'],['项目名称','pname'],['项目描述','pdesc']],
  award: [['奖项类型','atype'],['获奖情况','ainfo']],
};
let seq = 0;
for (const blk of document.querySelectorAll('[data-blk]')) {
  const kind = blk.dataset.blk;
  blk.querySelector('.addBtn___3r3aQ').addEventListener('click', () => {
    seq++;
    const wrap = document.createElement('div');
    wrap.innerHTML = TPL[kind].map(([lab, key]) => {
      /* 起止时间:两个各自独立的 ant-calendar-picker,标签只有 placeholder
         「开始日期」「结束日期」—— 京东就是这么写的 */
      if (lab === 'range') {
        return `<div class="fieldItem___1hMDk"><div class="filedName___2rXII">
            <span class="requiredStar___28AbY">*</span>起止时间:</div>
          <div class="filedValue___orYso"><div class="dateRangePicker___2IyoW">
            <span class="dateRangeStartPicker___39xpV ant-calendar-picker"><div>
              <input class="ant-calendar-picker-input ant-input" id="${kind}-sd-${seq}"
                     placeholder="开始日期" readonly></div></span>
            <span class="dateRangeSeparator___3CEeh">~</span>
            <span class="dateRangeEndPicker___fhag9 ant-calendar-picker"><div>
              <input class="ant-calendar-picker-input ant-input" id="${kind}-ed-${seq}"
                     placeholder="结束日期" readonly></div></span>
          </div></div></div>`;
      }
      const multi = /desc|info/.test(key);
      return `<div class="fieldItem___1hMDk"><div class="filedName___2rXII">${lab}:</div>
       <div class="filedValue___orYso">${multi
         ? `<textarea class="ant-input" id="${kind}-${key}-${seq}" placeholder="请输入"></textarea>`
         : `<input class="ant-input" id="${kind}-${key}-${seq}" placeholder="请输入">`}</div></div>`;
    }).join('');
    blk.insertBefore(wrap, blk.querySelector('.contentItem___3Qrnc'));
  });
}
</script>
<script>
/* ---- antd 3 日历:title 是中文「2024年9月1日」,面板初始停在当月,
       目标年月要靠「上一月/下一月」翻过去 ---- */
function wireCalendars(root) {
  for (const box of root.querySelectorAll('.ant-calendar-picker')) {
    if (box.dataset.wired) continue;
    box.dataset.wired = '1';
    const input = box.querySelector('input');
    const cal = document.createElement('div');
    cal.className = 'ant-calendar';
    cal.hidden = true;
    document.body.appendChild(cal);
    // 面板初始停在「当前月」(用一个固定的近期月份,保证测试可复现)
    let py = 2026, pm = 9;

    const render = () => {
      const days = new Date(py, pm, 0).getDate();
      let tds = '';
      for (let d = 1; d <= days; d++) {
        tds += `<td role="gridcell" class="ant-calendar-cell" title="${py}年${pm}月${d}日">${d}</td>`
             + (d % 7 === 0 ? '</tr><tr>' : '');
      }
      cal.innerHTML = `<div class="ant-calendar-header">
          <a class="ant-calendar-prev-month-btn">‹</a><b>${py}年${pm}月</b>
          <a class="ant-calendar-next-month-btn">›</a></div>
        <table><tbody><tr>${tds}</tr></tbody></table>`;
      cal.querySelector('.ant-calendar-prev-month-btn').addEventListener('mousedown', (e) => {
        e.preventDefault(); pm--; if (pm < 1) { pm = 12; py--; } render();
      });
      cal.querySelector('.ant-calendar-next-month-btn').addEventListener('mousedown', (e) => {
        e.preventDefault(); pm++; if (pm > 12) { pm = 1; py++; } render();
      });
      for (const td of cal.querySelectorAll('.ant-calendar-cell')) {
        td.addEventListener('mousedown', (e) => {
          e.preventDefault();
          const m = td.getAttribute('title').match(/(\d{4})年(\d{1,2})月/);
          input.value = `${m[1]}-${String(m[2]).padStart(2, '0')}`;
          cal.hidden = true;
        });
      }
    };

    box.addEventListener('mousedown', () => {
      document.querySelectorAll('.ant-calendar').forEach((c) => { if (c !== cal) c.hidden = true; });
      py = 2026; pm = 9; render();
      const r = box.getBoundingClientRect();
      cal.style.left = (r.left + scrollX) + 'px';
      cal.style.top = (r.bottom + scrollY + 4) + 'px';
      cal.hidden = false;
    });
  }
}

/* ---- antd 3 级联(籍贯):类名 ant-cascader-picker,含「picker」二字 ---- */
(() => {
  const TREE = { 广东省: ['深圳市', '广州市'], 上海市: ['徐汇区', '浦东新区'] };
  const box = document.getElementById('e-home');
  const label = box.querySelector('.ant-cascader-picker-label');
  const menus = document.createElement('div');
  menus.className = 'ant-cascader-menus';
  menus.hidden = true;
  document.body.appendChild(menus);
  const path = [];
  const render = () => {
    const cols = [Object.keys(TREE)];
    if (path[0]) cols.push(TREE[path[0]] || []);
    menus.innerHTML = cols.map((opts, li) => `<div class="ant-cascader-menu">${
      opts.map((o) => `<div class="ant-cascader-menu-item" data-li="${li}" data-o="${o}">${o}</div>`).join('')
    }</div>`).join('');
    for (const it of menus.querySelectorAll('.ant-cascader-menu-item')) {
      it.addEventListener('mousedown', (e) => {
        e.preventDefault();
        const li = Number(it.dataset.li);
        path.length = li; path.push(it.dataset.o);
        if (li === 1) { label.textContent = path.join(' / '); menus.hidden = true; }
        else render();
      });
    }
  };
  box.addEventListener('mousedown', () => {
    path.length = 0; render();
    const r = box.getBoundingClientRect();
    menus.style.left = (r.left + scrollX) + 'px';
    menus.style.top = (r.bottom + scrollY + 4) + 'px';
    menus.hidden = false;
  });
})();

// 新展开的区块里也有日历,展开后要重新接线
const _obs = new MutationObserver(() => wireCalendars(document));
_obs.observe(document.body, { childList: true, subtree: true });
wireCalendars(document);
</script>
<script src="run.js"></script>
<script>rqfAuto()</script>
</body>
</html>
