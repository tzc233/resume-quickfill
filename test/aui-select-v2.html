<script>
const trigger=document.querySelector('input'),menu=document.querySelector('.aui-select-dropdown');
trigger.onclick=()=>setTimeout(()=>menu.hidden=false,100);
menu.onclick=e=>{if(e.target.matches('li')){trigger.value=e.target.textContent;menu.hidden=true}};
(async()=>{const r=await __RQF_V2.fill({basic:{gender:'女'}});const fields=__RQF_V2_PARTS.discover();const report=await __RQF_V2.deepDiagnose({basic:{}});const checks={selected:trigger.value==='女',verified:r.v2.filled.length===1,separateType:__RQF_V2_PARTS.resolve(fields[1]).spec.key==='basic.idType',separateNumber:__RQF_V2_PARTS.resolve(fields[2]).spec.key==='basic.idNumber',audit:report.v2Inventory.fieldAudit.length===3};parent.postMessage({__rqf:true,pass:Object.values(checks).every(Boolean),checks},'*')})();
</script>
