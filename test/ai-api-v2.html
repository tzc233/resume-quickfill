<!doctype html><meta charset="utf-8"><title>云端模型传输层</title>
<!-- 云端模型只换传输层:提示词、档案栏白名单、validate、计分全部复用本机那一套。
     这一页钉死的是「发出去的到底是什么」—— 用假端点截下请求体逐条检查:
     字段的已有值、档案内容、API Key 都不许出现在 prompt 里;
     被硬规则拦下的字段(验证码等)一个请求都不许发出去;
     模型乱答(白名单外的键、越界的段号)必须按 none 处理。 -->
<script src="../ai.js"></script><script src="../ai-eval.js"></script>
<script>
window.rqfRun=async()=>{
  const AI=window.rqfAI;
  const sent=[];                      // 截下每一次请求
  const reply=(answers)=>({ok:true,json:async()=>({choices:[{message:{content:JSON.stringify({answers})}}]})});
  let nextAnswers=null;
  window.fetch=async(url,init)=>{
    sent.push({url,headers:init.headers,body:JSON.parse(init.body)});
    const ids=JSON.parse(init.body).messages[1].content.match(/"id":(\d+)/g).map(x=>+x.split(':')[1]);
    return reply(nextAnswers ? nextAnswers(ids) : ids.map(id=>({id,key:'none',record:-1})));
  };

  const KEY='sk-test-DO-NOT-LEAK-0001';
  const EP='https://my-gateway.example/api/v1/chat/completions';
  const s=AI.createApiSession({provider:'custom',endpoint:EP,apiKey:KEY,model:'deepseek-chat',lang:'zh'});

  // 刻意塞进「页面已有值」和「档案内容」,它们一个字都不该被发出去
  const fields=[
    {id:1,label:'学校',section:'教育经历',group:'教育经历 1',value:'机密学校名',profile:'机密档案值'},
    {id:2,label:'短信验证码',section:'基本信息',group:''},          // 硬规则拦下
    {id:3,label:'公司',section:'实习经历',group:'实习经历 2'},
  ];
  nextAnswers=(ids)=>ids.map(id=>id===1?{id,key:'education.school',record:0}
    :id===3?{id,key:'work.company',record:1}:{id,key:'none',record:-1});
  const got=await AI.resolveFields(s,fields,{chunk:4});
  // 只看发出去的两段消息:系统提示(里面本来就写着「验证码一律答 none」)与字段清单。
  // 不能把自己截下的请求头一起串进来查 —— Key 当然在请求头里。
  const asked=sent.map(r=>r.body.messages[1].content).join('\n');
  const whole=sent.map(r=>r.body.messages.map(m=>m.content).join('\n')).join('\n');

  // 模型乱答:白名单外的键、越界的段号、不属于这批的 id
  nextAnswers=(ids)=>[{id:ids[0],key:'basic.bankCard',record:-1},
    {id:ids[0],key:'education.school',record:99},{id:999,key:'basic.phone',record:-1}];
  const bad=await AI.resolveFields(s,[{id:7,label:'学校',section:'教育经历',group:'教育经历 1'}],{chunk:4});

  // 计分两种模式:段号算不算
  const cases=[{id:1,label:'学校',expect:'education.school',record:0}];
  const wrongRec=new Map([[1,{key:'education.school',record:3}]]);

  const checks={
    打到了自填的端点: sent[0].url===EP,
    Key走请求头不进提示词: sent[0].headers.Authorization==='Bearer '+KEY && !whole.includes(KEY),
    页面已有值不外发: !whole.includes('机密学校名'),
    档案内容不外发: !whole.includes('机密档案值'),
    标签照常发出: asked.includes('学校') && asked.includes('公司'),
    硬规则拦下的字段不进字段清单: !asked.includes('验证码'),
    验证码直接判不填: got.get(2).key==='none' && got.get(2).guarded===true,
    正常答案照常采纳: got.get(1).key==='education.school' && got.get(1).record===0
      && got.get(3).key==='work.company' && got.get(3).record===1,
    白名单外的键按none处理: bad.get(7).key==='none',
    不属于这批的id被丢掉: !bad.has(999),
    含段号计分_段号错算错填: AI.score(cases,wrongRec).wrong===1,
    忽略段号计分_段号错算正确: AI.score(cases,wrongRec,{ignoreRecord:true}).right===1,
    评测集仍是71题: window.rqfAIEval.reduce((n,f)=>n+f.cases.length,0)===71,
  };

  /* ---- 错误路径。上一版把失败静默压成 none:用户的网关端点不对、18 批全失败,
     报告却显示「错填 0 / 漏答 62 / 2.1 秒」,看不出一个字都没答上。 ---- */
  window.fetch=async(url,init)=>{sent.push({url,body:JSON.parse(init.body)});
    return {ok:false,status:401,text:async()=>JSON.stringify(
      {error:{message:'Invalid token: '+KEY}})};};
  const dead=await AI.resolveFields(s,[{id:9,label:'学校',section:'教育经历',group:'教育经历 1'}],{chunk:4});
  checks['调用失败要标出来不是答none']=dead.get(9).key==='none' && !!dead.get(9).failed;
  checks['错误里带上服务商的原话']=/401/.test(dead.get(9).failed) && /Invalid token/.test(dead.get(9).failed);
  checks['错误里的Key被打码']=!dead.get(9).failed.includes(KEY) && dead.get(9).failed.includes('***');

  // 端点没填 / 写成相对路径都要当场拦住,而不是发出一个打不中的请求
  const refuse=(cfg)=>{try{AI.createApiSession(cfg);return '';}catch(e){return e.message;}};
  checks['端点没填当场拦住']=/端点/.test(refuse({provider:'custom',apiKey:KEY}));
  checks['相对路径当场拦住']=/完整 URL/.test(refuse({provider:'custom',endpoint:'/api/v1/chat/completions',apiKey:KEY}));
  checks['没有Key当场拦住']=/Key/.test(refuse({provider:'custom',endpoint:EP}));

  // 端点不认 response_format 时去掉重试一次,而不是只报一句 400
  let n=0;
  window.fetch=async(url,init)=>{n++;const b=JSON.parse(init.body);
    if(b.response_format) return {ok:false,status:400,text:async()=>'response_format not supported'};
    return reply([{id:11,key:'education.school',record:0}]);};
  const s2=AI.createApiSession({provider:'custom',endpoint:EP,apiKey:KEY,lang:'zh'});
  const retried=await AI.resolveFields(s2,[{id:11,label:'学校',section:'教育经历',group:'教育经历 1'}],{chunk:4});
  checks['json模式被拒就去掉重试']=n===2 && retried.get(11).key==='education.school' && !retried.get(11).failed;
  checks['显式给了max_tokens']=sent[0].body.max_tokens>=512 && sent[0].body.stream===false;

  // 思考模型会在 JSON 外面裹推理文字 / ```json 围栏
  const wrapped=AI.validate('让我想想……\n```json\n{"answers":[{"id":5,"key":"basic.phone","record":-1}]}\n```\n以上。',[{id:5}]);
  checks['推理文字里的JSON抠得出来']=wrapped.get(5).key==='basic.phone';
  checks['真不是JSON就按none']=AI.validate('我拒绝回答',[{id:5}]).get(5).key==='none';

  // 交大网关的预设要和官方文档一致
  /* ---- 限流。交大网关配额 10 次请求,第一次整套对比 4 轮有 3 轮整轮被 429 打掉,
     报告却照样算出「13% 错填 0」。429 必须等配额重置后重试,而不是当成模型答 none。
     另外 429 文案里网关会把密钥裸串回显出来 —— 必须打码。 ---- */
  const RESET=new Date(Date.now()+1500).toISOString().replace('T',' ').replace(/\..+/,'')+' UTC';
  // 伪造的 64 位十六进制,形状照抄网关回显的样子。绝不能把真实密钥写进夹具 ——
  // 这个仓库是公开的。
  const HEXKEY='deadbeef'.repeat(8);
  let hits=0; const waits=[];
  window.fetch=async(url,init)=>{hits++;
    if(hits<=2) return {status:429,ok:false,headers:{get:()=>null},
      clone:()=>({text:async()=>'Rate limit exceeded for api_key: '+HEXKEY+'. Limit resets at: '+RESET}),
      text:async()=>'Rate limit exceeded for api_key: '+HEXKEY+'. Limit resets at: '+RESET};
    const ids=JSON.parse(init.body).messages[1].content.match(/"id":(\d+)/g).map(x=>+x.split(':')[1]);
    return reply(ids.map(id=>({id,key:'basic.phone',record:-1})));};
  const s3=AI.createApiSession({provider:'custom',endpoint:EP,apiKey:'sk-whatever',lang:'zh',
    onWait:(w)=>waits.push(w)});
  const t0=Date.now();
  const limited=await AI.resolveFields(s3,[{id:21,label:'手机号码',section:'基本信息',group:''}],{chunk:4});
  checks['被限流会等待后重试']=hits===3 && limited.get(21).key==='basic.phone' && !limited.get(21).failed;
  checks['等待过程有回调可提示']=waits.length===2 && waits[0].ms>=1000;
  checks['确实等了而不是空转']=Date.now()-t0>=1000;

  // 重试次数用尽后才算失败,且错误里的裸密钥被打码
  let always=0;
  window.fetch=async()=>{always++;return {status:429,ok:false,headers:{get:()=>null},
    clone:()=>({text:async()=>'Rate limit exceeded for api_key: '+HEXKEY}),
    text:async()=>'Rate limit exceeded for api_key: '+HEXKEY};};
  const s4=AI.createApiSession({provider:'custom',endpoint:EP,apiKey:'sk-whatever',lang:'zh'});
  const dead2=await AI.resolveFields(s4,[{id:31,label:'手机号码',section:'基本信息',group:''}],{chunk:4});
  checks['一直限流最终报失败']=!!dead2.get(31).failed && /429/.test(dead2.get(31).failed);
  checks['网关回显的裸密钥被打码']=!dead2.get(31).failed.includes(HEXKEY)
    && dead2.get(31).failed.includes('***');

  checks['交大网关预设正确']=AI.API_PROVIDERS.sjtu.endpoint==='https://models.sjtu.edu.cn/api/v1/chat/completions'
    && AI.API_PROVIDERS.sjtu.models.includes('deepseek-chat')
    && AI.API_PROVIDERS.sjtu.models.includes('qwen3.8-27b');
  const fails=Object.keys(checks).filter(k=>!checks[k]);
  return {page:'ai-api-v2.html',pass:!fails.length,total:Object.keys(checks).length,fails,
    requests:sent.length};
};
if(location.search.includes('run=1'))rqfRun().then(r=>parent.postMessage({__rqf:true,...r},'*'))
  .catch(e=>parent.postMessage({__rqf:true,page:'ai-api-v2.html',pass:false,total:0,fails:[String(e&&e.message||e)]},'*'));
</script>
